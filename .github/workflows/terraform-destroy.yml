name: "Infrastructure Cleanup"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
        default: dev
      confirm_destroy:
        description: "Type 'DESTROY' to confirm infrastructure destruction"
        required: true
        type: string
      reason:
        description: "Reason for destruction"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate-destroy:
    name: "Validate Destroy Request"
    runs-on: ubuntu-latest
    steps:
      - name: Validate Input
        run: |
          if [[ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]]; then
            echo "❌ Confirmation input must be 'DESTROY'"
            exit 1
          fi

          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "❌ Production environment cannot be destroyed via this workflow"
            exit 1
          fi

          echo "✅ Destroy request validated"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Reason: ${{ github.event.inputs.reason }}"

  terraform-destroy:
    name: "Destroy Infrastructure"
    needs: validate-destroy
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      terraform_version: "1.5.0"
      working_directory: "infrastructure/environments/${{ github.event.inputs.environment }}"
      aws_region: ${{ github.event.inputs.environment == 'staging' && 'us-west-2' || 'us-east-1' }}
      auto_apply: true
      destroy_mode: true
      var_file: "terraform.tfvars"
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  notify-destroy:
    name: "Notify Destruction"
    runs-on: ubuntu-latest
    needs: terraform-destroy
    if: always()
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "terraform-alerts"
          slack-message: |
            🗑️ Infrastructure destruction: ${{ needs.terraform-destroy.result }}
            Environment: ${{ github.event.inputs.environment }}
            Actor: ${{ github.actor }}
            Reason: ${{ github.event.inputs.reason }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        if: env.SLACK_BOT_TOKEN != ''

  create-issue:
    name: "Create Tracking Issue"
    runs-on: ubuntu-latest
    needs: terraform-destroy
    if: needs.terraform-destroy.result == 'success'
    steps:
      - name: Create Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Infrastructure destroyed: ${{ github.event.inputs.environment }}`;
            const body = `
            ## Infrastructure Destruction Report

            **Environment:** ${{ github.event.inputs.environment }}
            **Actor:** ${{ github.actor }}
            **Date:** ${new Date().toISOString()}
            **Reason:** ${{ github.event.inputs.reason }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The ${{ github.event.inputs.environment }} environment has been successfully destroyed.

            ### Next Steps
            - [ ] Verify all resources have been cleaned up
            - [ ] Check for any remaining costs in AWS billing
            - [ ] Update documentation if needed
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['infrastructure', 'cleanup', '${{ github.event.inputs.environment }}']
            });
