name: "Production Environment CI/CD (Multi-Account)"

on:
  push:
    branches: ["main"]
    paths:
      - "infrastructure/environments/prod/**"
      - "infrastructure/modules/**"
      - "app/**"
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  id-token: write
  deployments: write

jobs:
  security-check:
    name: "Security Pre-Deployment Check"
    runs-on: ubuntu-latest
    outputs:
      security_status: ${{ steps.security.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Security Scan
        id: security
        uses: bridgecrewio/checkov-action@v12.3050.0
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: reports/results.sarif
          check: CKV_AWS_*
          skip_check: CKV_AWS_18,CKV_AWS_19
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/results.sarif

  approval-gate:
    name: "Production Deployment Approval"
    runs-on: ubuntu-latest
    needs: security-check
    environment: production-approval
    steps:
      - name: Manual Approval Required
        run: |
          echo "🔒 Production deployment requires manual approval"
          echo "✅ Security scan status: ${{ needs.security-check.outputs.security_status }}"

  terraform-prod:
    name: "Production Environment (Prod Account)"
    needs: [security-check, approval-gate]
    uses: ./.github/workflows/terraform-multi-account.yml
    with:
      environment: "prod"
      terraform_version: "1.5.0"
      working_directory: "infrastructure/environments/prod"
      aws_region: "us-east-1"
      aws_account_id: "PRODUCTION_AWS_ACCOUNT_ID"
      deployment_role_name: "GitHubActionsDeploymentRole"
      auto_apply: true
      var_file: "terraform.tfvars"
      enable_backup: true
      enable_monitoring: true
    secrets:
      BACKEND_ROLE_ARN: ${{ secrets.TERRAFORM_BACKEND_ROLE_ARN }}

  backup-verification:
    name: "Backup Verification"
    runs-on: ubuntu-latest
    needs: terraform-prod
    if: needs.terraform-prod.outputs.apply_status == 'success'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::PRODUCTION_AWS_ACCOUNT_ID:role/GitHubActionsDeploymentRole
          role-session-name: BackupVerification-${{ github.run_id }}
          aws-region: us-east-1

      - name: Verify Backup Systems
        run: |
          echo "🔍 Verifying backup systems..."

          # Check AWS Backup plans
          echo "📦 Checking AWS Backup plans..."
          aws backup list-backup-plans || echo "⚠️ No backup plans found"

          # Check EBS snapshots
          echo "💾 Checking recent EBS snapshots..."
          aws ec2 describe-snapshots \
            --owner-ids self \
            --max-items 10 \
            --query 'Snapshots[?StartTime>=`2024-01-01`].[SnapshotId,Description,StartTime,State]' \
            --output table || echo "⚠️ No recent snapshots found"

          # Check RDS snapshots
          echo "🗄️ Checking RDS snapshots..."
          aws rds describe-db-snapshots \
            --max-records 10 \
            --query 'DBSnapshots[?SnapshotCreateTime>=`2024-01-01`].[DBSnapshotIdentifier,DBInstanceIdentifier,SnapshotCreateTime,Status]' \
            --output table || echo "⚠️ No RDS snapshots found"

  monitoring-setup:
    name: "Production Monitoring Setup"
    runs-on: ubuntu-latest
    needs: terraform-prod
    if: needs.terraform-prod.outputs.apply_status == 'success'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::PRODUCTION_AWS_ACCOUNT_ID:role/GitHubActionsDeploymentRole
          role-session-name: MonitoringSetup-${{ github.run_id }}
          aws-region: us-east-1

      - name: Setup CloudWatch Alarms
        run: |
          echo "📊 Setting up production monitoring..."

          # Create high-priority alarms
          echo "🚨 Creating critical infrastructure alarms..."

          # EKS Cluster Health
          aws cloudwatch put-metric-alarm \
            --alarm-name "EKS-Cluster-Failed-Node-Count" \
            --alarm-description "Alert when EKS nodes fail" \
            --metric-name "cluster_failed_node_count" \
            --namespace "AWS/EKS" \
            --statistic Sum \
            --period 300 \
            --threshold 1 \
            --comparison-operator GreaterThanOrEqualToThreshold \
            --evaluation-periods 2 || echo "⚠️ EKS alarm creation failed"

          # RDS Connection Health
          aws cloudwatch put-metric-alarm \
            --alarm-name "RDS-Connection-Count-High" \
            --alarm-description "Alert when RDS connections are high" \
            --metric-name "DatabaseConnections" \
            --namespace "AWS/RDS" \
            --statistic Average \
            --period 300 \
            --threshold 80 \
            --comparison-operator GreaterThanThreshold \
            --evaluation-periods 2 || echo "⚠️ RDS alarm creation failed"

  compliance-check:
    name: "Compliance Verification"
    runs-on: ubuntu-latest
    needs: terraform-prod
    if: needs.terraform-prod.outputs.apply_status == 'success'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::PRODUCTION_AWS_ACCOUNT_ID:role/GitHubActionsDeploymentRole
          role-session-name: ComplianceCheck-${{ github.run_id }}
          aws-region: us-east-1

      - name: Run Compliance Checks
        run: |
          echo "📋 Running production compliance checks..."

          # Check encryption status
          echo "🔐 Verifying encryption compliance..."

          # EBS Encryption
          UNENCRYPTED_VOLUMES=$(aws ec2 describe-volumes \
            --query 'Volumes[?Encrypted==`false`].VolumeId' \
            --output text)

          if [ -n "$UNENCRYPTED_VOLUMES" ]; then
            echo "❌ COMPLIANCE FAILURE: Unencrypted EBS volumes found: $UNENCRYPTED_VOLUMES"
            exit 1
          else
            echo "✅ All EBS volumes are encrypted"
          fi

          # RDS Encryption
          UNENCRYPTED_DBS=$(aws rds describe-db-instances \
            --query 'DBInstances[?StorageEncrypted==`false`].DBInstanceIdentifier' \
            --output text)

          if [ -n "$UNENCRYPTED_DBS" ]; then
            echo "❌ COMPLIANCE FAILURE: Unencrypted RDS instances found: $UNENCRYPTED_DBS"
            exit 1
          else
            echo "✅ All RDS instances are encrypted"
          fi

          # S3 Bucket Encryption
          aws s3api list-buckets --query 'Buckets[].Name' --output text | while read bucket; do
            encryption=$(aws s3api get-bucket-encryption --bucket "$bucket" 2>/dev/null || echo "none")
            if [ "$encryption" = "none" ]; then
              echo "❌ COMPLIANCE FAILURE: Unencrypted S3 bucket: $bucket"
              exit 1
            fi
          done

          echo "✅ Compliance checks passed"

  notify-prod:
    name: "Notify Production Team"
    runs-on: ubuntu-latest
    needs:
      [terraform-prod, backup-verification, monitoring-setup, compliance-check]
    if: always()
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          channel-id: "terraform-prod"
          slack-message: |
            🏭 Production Environment Deployment

            **Status:** ${{ needs.terraform-prod.result }}
            **Account:** PRODUCTION_AWS_ACCOUNT_ID (Production)
            **Region:** us-east-1
            **Actor:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}

            **Post-Deployment Checks:**
            - Backup Verification: ${{ needs.backup-verification.result || 'skipped' }}
            - Monitoring Setup: ${{ needs.monitoring-setup.result || 'skipped' }}
            - Compliance Check: ${{ needs.compliance-check.result || 'skipped' }}

            ${{ needs.terraform-prod.result == 'success' && '✅ Production deployment successful!' || '❌ Production deployment failed!' }}

            ${{ needs.compliance-check.result == 'failure' && '🚨 **COMPLIANCE FAILURE** - Immediate attention required!' || '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        if: env.SLACK_BOT_TOKEN != ''

      - name: Create GitHub Release
        if: needs.terraform-prod.result == 'success' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "prod-${{ github.run_number }}"
          release_name: "Production Release ${{ github.run_number }}"
          body: |
            🏭 Production deployment completed successfully

            **Deployment Details:**
            - Commit: ${{ github.sha }}
            - Actor: ${{ github.actor }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}

            **Infrastructure Status:**
            - Terraform Apply: ✅ Success
            - Security Scan: ${{ needs.security-check.outputs.security_status }}
            - Backup Verification: ${{ needs.backup-verification.result }}
            - Monitoring Setup: ${{ needs.monitoring-setup.result }}
            - Compliance Check: ${{ needs.compliance-check.result }}
          draft: false
          prerelease: false
