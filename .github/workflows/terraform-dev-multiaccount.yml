name: "Development Environment CI/CD (Multi-Account)"

on:
  push:
    branches: ["develop", "feature/*"]
    paths:
      - "infrastructure/environments/dev/**"
      - "infrastructure/modules/**"
      - "app/**"
  pull_request:
    branches: ["develop"]
    paths:
      - "infrastructure/environments/dev/**"
      - "infrastructure/modules/**"
      - "app/**"
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-dev:
    name: "Development Environment (Non-Prod Account)"
    uses: ./.github/workflows/terraform-multi-account.yml
    with:
      environment: "dev"
      terraform_version: "1.5.0"
      working_directory: "infrastructure/environments/dev"
      aws_region: "us-east-1"
      aws_account_id: "123456789013" # Non-prod account ID - replace with actual
      deployment_role_name: "GitHubActionsDeploymentRole"
      auto_apply: ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
      var_file: "terraform.tfvars"

  cost-analysis:
    name: "Cost Analysis"
    runs-on: ubuntu-latest
    needs: terraform-dev
    if: needs.terraform-dev.outputs.terraform_apply_status == 'success'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::123456789013:role/GitHubActionsDeploymentRole
          role-session-name: CostAnalysis-${{ github.run_id }}
          aws-region: us-east-1

      - name: Estimate Monthly Costs
        run: |
          echo "💰 Analyzing development environment costs..."

          # Get current month costs for dev environment
          START_DATE=$(date -d "$(date +%Y-%m-01)" +%Y-%m-%d)
          END_DATE=$(date +%Y-%m-%d)

          echo "📅 Cost period: $START_DATE to $END_DATE"

          # Use AWS Cost Explorer API (requires permissions)
          aws ce get-cost-and-usage \
            --time-period Start=$START_DATE,End=$END_DATE \
            --granularity MONTHLY \
            --metrics BlendedCost \
            --group-by Type=DIMENSION,Key=SERVICE \
            --filter file://<(echo '{
              "Dimensions": {
                "Key": "LINKED_ACCOUNT",
                "Values": ["123456789013"]
              }
            }') || echo "⚠️ Cost analysis requires Cost Explorer permissions"

  notify-dev:
    name: "Notify Development Team"
    runs-on: ubuntu-latest
    needs: [terraform-dev, cost-analysis]
    if: always()
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          channel-id: "terraform-dev"
          slack-message: |
            🚀 Development Environment Deployment

            **Status:** ${{ needs.terraform-dev.result }}
            **Account:** 123456789013 (Non-Prod)
            **Region:** us-east-1
            **Actor:** ${{ github.actor }}
            **Commit:** ${{ github.sha }}
            **Cost Analysis:** ${{ needs.cost-analysis.result || 'skipped' }}

            ${{ needs.terraform-dev.result == 'success' && '✅ Deployment successful!' || '❌ Deployment failed!' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        if: env.SLACK_BOT_TOKEN != ''
