name: "Terraform CI/CD Orchestrator"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  detect-changes:
    name: "Detect Infrastructure Changes"
    runs-on: ubuntu-latest
    outputs:
      dev-changed: ${{ steps.changes.outputs.dev }}
      staging-changed: ${{ steps.changes.outputs.staging }}
      prod-changed: ${{ steps.changes.outputs.prod }}
      modules-changed: ${{ steps.changes.outputs.modules }}
      apps-changed: ${{ steps.changes.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Changes
        # Use verified dorny/paths-filter action - maintained by a trusted contributor
        # Version 3.0.2 with security improvements and better performance
        uses: dorny/paths-filter@v3.0.2
        id: changes
        with:
          filters: |
            dev:
              - 'infrastructure/environments/dev/**'
            staging:
              - 'infrastructure/environments/staging/**'
            prod:
              - 'infrastructure/environments/prod/**'
            modules:
              - 'infrastructure/modules/**'
            apps:
              - 'app/**'

  trigger-dev:
    name: "Trigger Development Workflow"
    needs: detect-changes
    if: |
      (needs.detect-changes.outputs.dev-changed == 'true' || 
       needs.detect-changes.outputs.modules-changed == 'true' || 
       needs.detect-changes.outputs.apps-changed == 'true') &&
      (github.ref == 'refs/heads/develop' || github.base_ref == 'develop')
    uses: ./.github/workflows/terraform-dev.yml

  trigger-staging:
    name: "Trigger Staging Workflow"
    needs: detect-changes
    if: |
      (needs.detect-changes.outputs.staging-changed == 'true' || 
       needs.detect-changes.outputs.modules-changed == 'true' || 
       needs.detect-changes.outputs.apps-changed == 'true') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/terraform-staging.yml

  summary:
    name: "Deployment Summary"
    runs-on: ubuntu-latest
    needs: [detect-changes, trigger-dev, trigger-staging]
    if: always()
    steps:
      - name: Create Summary
        run: |
          echo "## 🚀 Terraform Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes Detected:" >> $GITHUB_STEP_SUMMARY
          echo "- **Development:** ${{ needs.detect-changes.outputs.dev-changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Staging:** ${{ needs.detect-changes.outputs.staging-changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Production:** ${{ needs.detect-changes.outputs.prod-changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Modules:** ${{ needs.detect-changes.outputs.modules-changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Applications:** ${{ needs.detect-changes.outputs.apps-changed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **Development:** ${{ needs.trigger-dev.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Staging:** ${{ needs.trigger-staging.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
